services:
  subjects-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-subjects_db}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - subjects-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-subjects_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  subjects-service:
    build: .
    ports:
      - "8082:8082"
    environment:
      DB_HOST: subjects-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-subjects_db}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_ENABLED: ${SEED_ENABLED:-true}
    depends_on:
      subjects-db:
        condition: service_healthy

volumes:
  subjects-db-data: